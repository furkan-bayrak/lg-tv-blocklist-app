name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check LF line endings in shell scripts and filter assets
        run: |
          if grep -rIl $'\r' app/scripts tests/shell tests/g1 app/filter; then
            echo "::error::CRLF detected in app/scripts, tests/shell, tests/g1 or app/filter — commit with LF (see .gitattributes)"
            exit 1
          fi

      - name: Build (TypeScript -> ES5) and run the ES5 guard
        run: npm run build && npm run check:es5

      # The ES5 guard is a pattern scan over masked text; this runs the parser
      # the TV itself uses (node v8.12.0, so node@8.17.0 is the closest proxy).
      # Kept next to the other syntax check so a device-breaking construct fails
      # the build before the slow packaging steps. Needs the npm registry for
      # node@8.17.0; if that fetch fails the step fails on purpose rather than
      # reporting a gate that never ran.
      - name: Node 8 parse gate (the parser the TV runs)
        run: npm run check:node8

      - name: Shellcheck (POSIX mode) on shell glue
        run: shellcheck -s sh -S warning app/scripts/*.sh tests/shell/*.sh tests/shell/stub-bin/* tests/g1/*.sh

      - name: Unit tests (status parser + bridge gate)
        run: npm run test:ts

      - name: Shell tests (check.sh sandbox)
        run: sh tests/shell/run-tests.sh

      - name: Packaging metadata regression tests (synthetic archives only)
        run: npm run test:packaging

      - name: Fetch + verify filter binary (pinned sha256)
        run: node tools/fetch-filter.mjs

      - name: Package IPK and normalize metadata before assertions or hashing
        run: npm run package

      - name: Assert normalized IPK metadata and byte-identical payloads
        run: |
          python3 -B - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          import re
          import tarfile

          ipks = list(Path('dist').glob('*.ipk'))
          assert len(ipks) == 1, 'expected exactly one generated IPK'
          blob = ipks[0].read_bytes()
          assert blob[:8] == b'!<arch>\n'
          offset, members = 8, {}
          for expected in ('debian-binary', 'control.tar.gz', 'data.tar.gz'):
              header = blob[offset:offset + 60]
              assert len(header) == 60 and header[58:] == b'`\n'
              assert header[:16].decode().strip() == expected
              assert (int(header[16:28]), int(header[28:34]), int(header[34:40]), int(header[40:48], 8)) == (0, 0, 0, 0o100644)
              size = int(header[48:58])
              members[expected] = blob[offset + 60:offset + 60 + size]
              assert len(members[expected]) == size
              if size % 2:
                  assert blob[offset + 60 + size:offset + 61 + size] == b'\n'
              offset += 60 + size + size % 2
          assert offset == len(blob) and members['debian-binary'] == b'2.0\n'
          appdir = 'usr/palm/applications/io.github.furkanbayrak.lgtvblocklist/'
          pkginfo = 'usr/palm/packages/io.github.furkanbayrak.lgtvblocklist/packageinfo.json'
          source = {appdir + p.relative_to('app').as_posix(): p.read_bytes()
                    for p in Path('app').rglob('*') if p.is_file()}
          executables = {appdir + 'filter/dnscrypt-proxy'} | {
              appdir + 'scripts/' + p.name for p in Path('app/scripts').glob('*.sh')}
          files = {}
          for name in ('control.tar.gz', 'data.tar.gz'):
              compressed = members[name]
              assert compressed[3:8] == b'\0' * 5, 'gzip flags/time not normalized'
              seen = set()
              with tarfile.open(fileobj=io.BytesIO(compressed), mode='r:gz') as archive:
                  for member in archive:
                      assert member.name not in seen, 'duplicate tar path'
                      seen.add(member.name)
                      assert member.type in (tarfile.REGTYPE, tarfile.DIRTYPE)
                      assert (member.uid, member.gid, member.uname, member.gname, member.mtime) == (0, 0, 'root', 'root', 0)
                      mode = 0o755 if member.isdir() or member.name in executables else 0o644
                      assert member.mode == mode, (member.name, oct(member.mode))
                      if member.isfile():
                          files[(name, member.name)] = archive.extractfile(member).read()
          assert {p for archive, p in files if archive == 'control.tar.gz'} == {'control'}
          packaged = {p: b for (archive, p), b in files.items() if archive == 'data.tar.gz'}
          assert set(packaged) == set(source) | {pkginfo}
          for path, payload in source.items():
              assert hashlib.sha256(packaged[path]).digest() == hashlib.sha256(payload).digest(), path
          info = json.loads(packaged[pkginfo])
          appinfo = json.loads(source[appdir + 'appinfo.json'])
          assert all(info[key] == appinfo[key] for key in ('id', 'version'))
          pin = re.search(r"const BIN_SHA256 = '([0-9a-f]{64})'", Path('tools/fetch-filter.mjs').read_text()).group(1)
          assert hashlib.sha256(packaged[appdir + 'filter/dnscrypt-proxy']).hexdigest() == pin
          assert b'chmod +x "$FILTER_BIN"' in packaged[appdir + 'scripts/common.sh']
          print('IPK metadata OK: root ownership, 0755 dirs/helpers/filter, 0644 assets/control/packageinfo; all payload hashes unchanged')
          PY

      - name: Install webosbrew toolbox (gen-manifest, ipk-verify, firmware data)
        run: |
          base=https://github.com/webosbrew/dev-toolbox-cli/releases/download/v20260818-ea38b20
          curl -fsSLo /tmp/gen-manifest.deb "$base/webosbrew-toolbox-gen-manifest_0.9.0-1_amd64.deb"
          curl -fsSLo /tmp/ipk-verify.deb   "$base/webosbrew-toolbox-ipk-verify_0.9.0-1_amd64.deb"
          curl -fsSLo /tmp/fw-symbols.deb   "$base/webosbrew-toolbox-fw-symbols_0.9.0-1_amd64.deb"
          sudo dpkg -i /tmp/gen-manifest.deb /tmp/ipk-verify.deb /tmp/fw-symbols.deb

      - name: Generate Homebrew manifest (rootRequired lives in the manifest)
        run: |
          webosbrew-gen-manifest \
            --pkgfile dist/*.ipk \
            --output dist/app.manifest.json \
            --icon "https://github.com/furkan-bayrak/lg-tv-blocklist-app/raw/main/app/icon.png" \
            --link "https://github.com/furkan-bayrak/lg-tv-blocklist-app" \
            --root true

      - name: Assert manifest values
        run: |
          jq -e '.id == "io.github.furkanbayrak.lgtvblocklist"
                 and .version == "0.4.2"
                 and .rootRequired == true
                 and (.ipkHash.sha256 | length == 64)' dist/app.manifest.json > /dev/null

      - name: Verify IPK compatibility (webosbrew-ipk-verify)
        run: webosbrew-ipk-verify dist/*.ipk

      - name: Show artifact hash
        run: sha256sum dist/*.ipk

      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/app.manifest.json
