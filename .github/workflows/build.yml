name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check LF line endings in shell scripts and filter assets
        run: |
          if grep -rIl $'\r' app/scripts tests/shell tests/g1 app/filter; then
            echo "::error::CRLF detected in app/scripts, tests/shell, tests/g1 or app/filter — commit with LF (see .gitattributes)"
            exit 1
          fi

      - name: Build (TypeScript -> ES5) and run the ES5 guard
        run: npm run build && npm run check:es5

      # The ES5 guard is a pattern scan over masked text; this runs the parser
      # the TV itself uses (node v8.12.0, so node@8.17.0 is the closest proxy).
      # Kept next to the other syntax check so a device-breaking construct fails
      # the build before the slow packaging steps. Needs the npm registry for
      # node@8.17.0; if that fetch fails the step fails on purpose rather than
      # reporting a gate that never ran.
      - name: Node 8 parse gate (the parser the TV runs)
        run: npm run check:node8

      - name: Shellcheck (POSIX mode) on shell glue
        run: shellcheck -s sh -S warning app/scripts/*.sh tests/shell/*.sh tests/shell/stub-bin/* tests/g1/*.sh

      - name: Unit tests (status parser + bridge gate)
        run: npm run test:ts

      - name: Shell tests (check.sh sandbox)
        run: sh tests/shell/run-tests.sh

      - name: Fetch + verify filter binary (pinned sha256)
        run: node tools/fetch-filter.mjs

      - name: Package IPK
        run: npx ares-package --outdir dist --no-minify app

      - name: Assert IPK contents (pinned filter binary + runtime scripts present)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          ar p dist/*.ipk data.tar.gz | tar -xzf - -C "$tmp"
          appdir="usr/palm/applications/io.github.furkanbayrak.lgtvblocklist"
          for f in \
            filter/dnscrypt-proxy \
            filter/filter-input.txt \
            filter/filter-input-safe.txt \
            filter/filter-input-strict.txt \
            filter/domains.json \
            filter/dnscrypt-proxy.toml.template \
            filter/forward-rules.txt.template \
            filter/LICENSE.dnscrypt-proxy.txt \
            scripts/common.sh \
            scripts/keeper.sh \
            scripts/guard.sh \
            scripts/apply.sh \
            scripts/rollback.sh; do
            if [ ! -f "$tmp/$appdir/$f" ]; then
              echo "::error::missing in IPK: $appdir/$f"
              exit 1
            fi
          done
          # The binary must survive packaging byte-for-byte (pin lives in tools/fetch-filter.mjs).
          pin="$(node -e "const s=require('node:fs').readFileSync('tools/fetch-filter.mjs','utf8');const m=s.match(/const BIN_SHA256 = '([0-9a-f]{64})'/);if(!m)process.exit(1);console.log(m[1])")"
          got="$(sha256sum "$tmp/$appdir/filter/dnscrypt-proxy" | cut -d' ' -f1)"
          if [ "$got" != "$pin" ]; then
            echo "::error::IPK filter binary sha256 $got != pin $pin"
            exit 1
          fi
          # ares-package normalizes all modes to 666 (verified 2026-09-22), so the
          # package can never carry the exec bit. The runtime mitigation lives in
          # common.sh (`chmod +x "$FILTER_BIN"` before every filter start) — assert
          # the packaged copy still has it.
          if ! grep -q 'chmod +x "$FILTER_BIN"' "$tmp/$appdir/scripts/common.sh"; then
            echo "::error::packaged common.sh lost the chmod +x filter mitigation"
            exit 1
          fi
          echo "IPK contents OK — filter binary sha256 $got (byte-identical to pin), runtime scripts present"

      - name: Install webosbrew toolbox (gen-manifest, ipk-verify, firmware data)
        run: |
          base=https://github.com/webosbrew/dev-toolbox-cli/releases/download/v20260818-ea38b20
          curl -fsSLo /tmp/gen-manifest.deb "$base/webosbrew-toolbox-gen-manifest_0.9.0-1_amd64.deb"
          curl -fsSLo /tmp/ipk-verify.deb   "$base/webosbrew-toolbox-ipk-verify_0.9.0-1_amd64.deb"
          curl -fsSLo /tmp/fw-symbols.deb   "$base/webosbrew-toolbox-fw-symbols_0.9.0-1_amd64.deb"
          sudo dpkg -i /tmp/gen-manifest.deb /tmp/ipk-verify.deb /tmp/fw-symbols.deb

      - name: Generate Homebrew manifest (rootRequired lives in the manifest)
        run: |
          webosbrew-gen-manifest \
            --pkgfile dist/*.ipk \
            --output dist/app.manifest.json \
            --icon "https://github.com/furkan-bayrak/lg-tv-blocklist-app/raw/main/app/icon.png" \
            --link "https://github.com/furkan-bayrak/lg-tv-blocklist-app" \
            --root true

      - name: Assert manifest values
        run: |
          jq -e '.id == "io.github.furkanbayrak.lgtvblocklist"
                 and .version == "0.4.2"
                 and .rootRequired == true
                 and (.ipkHash.sha256 | length == 64)' dist/app.manifest.json > /dev/null

      - name: Verify IPK compatibility (webosbrew-ipk-verify)
        run: webosbrew-ipk-verify dist/*.ipk

      - name: Show artifact hash
        run: sha256sum dist/*.ipk

      - uses: actions/upload-artifact@v7
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/app.manifest.json
